<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="250 400 5900 2350"
     preserveAspectRatio="xMinYMid meet"
     role="img"
     aria-label="SCANTRIX">
  <defs>
    <style>
      /* Magnifying glass accent strokes */
      .st0 { fill: #4c79f6; }

      /* Magnifying glass base fill */
      .st4 { fill: #e5e7eb; }

      /* Wordmark */
      .st3 {
        font-family: Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 950px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      /* Tagline */
      .st1 {
        font-family: Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 182px;
        fill: #4c79f6;
        font-weight: 500;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

