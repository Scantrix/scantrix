  </g>

  <!-- Wordmark: single text element — browser handles natural kerning -->
  <text class="st3" x="1280" y="1750">
    <tspan fill="#e5e7eb">SC</tspan><tspan fill="#e5e7eb">&#923;</tspan><tspan fill="#e5e7eb">NTR</tspan>
  </text>
  <!-- dot over the "i" -->
  <circle cx="5280" cy="1155" r="70" fill="#e5e7eb" opacity="0.9"/>

    <!-- Decorative accent line used as the i -->
  <rect x="5210" y="1300" width="150" height="450" rx="1" fill="#4c79f6" opacity="0.9"/>
  <text class="st3" x="5460" y="1750">
