    <path id="handle"  class="st0" d="M330.79,2485.74c62.06,63.97,115.51,119.05,174.28,179.63,157.04-143.23,310.66-283.34,466.6-425.57-55.48-62.47-108.38-122.04-166.51-187.5-158.9,145.19-316.97,289.62-474.38,433.44Z"/>
