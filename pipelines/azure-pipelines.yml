# ============================================================================
# Scantrix — Daily Multi-Repo Audit Pipeline
# ============================================================================
# Runs on a daily schedule, scanning multiple ADO repos.
# Scantrix source is checked out from GitHub via a service connection.
# Each target repo gets an independent parallel job via the scan-repo template.
#
# Setup:
#   1. Create a GitHub service connection in ADO:
#      Project Settings > Service connections > New > GitHub
#      Name it "GitHub-Scantrix" (or update the endpoint below)
#      Grant it read access to Scantrix/scantrix
#
#   2. Grant the build service read access to each target repo's project:
#      Target project > Project Settings > Repos > Security
#      > grant Read to "<HostProject> Build Service (<Org>)"
#
# To add a new repo:
#   1. Add a resources.repositories entry (alias + <Project>/<Repo>)
#   2. Add a template invocation under the Scan stage
# ============================================================================

trigger: none          # No CI trigger — schedule only

schedules:
  - cron: "0 6 * * *"  # Daily at 06:00 UTC
    displayName: "Daily Scantrix Scan"
    branches:
      include:
        - main
    always: true        # Run even if no source changes

# ---------------------------------------------------------------------------
# Pool — use a Microsoft-hosted Ubuntu agent
# Override at job level if you need a self-hosted agent
# ---------------------------------------------------------------------------
pool:
  name: "On-Premise"

# ---------------------------------------------------------------------------
# Repositories
# ---------------------------------------------------------------------------
# scantrix: GitHub repo (private) — requires a GitHub service connection
# Target repos: ADO repos to scan — one entry per repo
#
# Alias rules:
#   - Must be unique across the pipeline
#   - Used as the checkout directory name and artifact suffix
#   - Keep short, lowercase, hyphenated
#
# NOTE: Replace project names and repo names with your actual values.
# ---------------------------------------------------------------------------
resources:
  repositories:
    # ── Scantrix source (GitHub) ──────────────────────────────────────
    - repository: scantrix
      type: github
      endpoint: GitHub-Scantrix        # ADO service connection name
      name: Scantrix/scantrix
      ref: refs/heads/main

    # ── Target ADO repos ─────────────────────────────────────────────
    - repository: service-playwright
      type: git
      name: IT-Service Value Stream/Service.Playwright.Automation
      ref: refs/heads/main

# =========================================================================
# Stage 1 — Build Scantrix (from GitHub)
# =========================================================================
stages:
  - stage: Build
    displayName: "Build Scantrix"
    jobs:
      - job: BuildScantrix
        displayName: "npm ci + build + pack"
        steps:
          - checkout: scantrix
            displayName: "Checkout Scantrix from GitHub"
            path: s/scantrix

          - task: NodeTool@0
            displayName: "Use Node.js 20.x"
            inputs:
              versionSpec: "20.x"

          - script: npm ci
            displayName: "Install dependencies"
            workingDirectory: $(Build.SourcesDirectory)/scantrix

          - script: npm run build
            displayName: "Compile TypeScript"
            workingDirectory: $(Build.SourcesDirectory)/scantrix

          - script: npm pack
            displayName: "Create tarball"
            workingDirectory: $(Build.SourcesDirectory)/scantrix

          - publish: $(Build.SourcesDirectory)/scantrix/scantrix-6.3.0.tgz
            artifact: scantrix-tarball
            displayName: "Publish Scantrix tarball"

  # =======================================================================
  # Stage 2 — Scan target repos (parallel jobs via template)
  # =======================================================================
  - stage: Scan
    displayName: "Scan Repos"
    dependsOn: Build
    jobs:
      # ── Service.Playwright.Automation ────────────────────────────────
      - template: templates/scan-repo.yml
        parameters:
          repoAlias: service-playwright
          repoName: Service.Playwright.Automation
          project: IT-Service Value Stream
