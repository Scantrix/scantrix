<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient - deep navy indigo -->
    <linearGradient id="qShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="45%" style="stop-color:#152850"/>
      <stop offset="100%" style="stop-color:#1d3d84"/>
    </linearGradient>
    <!-- Accent gradient - indigo blue -->
    <linearGradient id="qAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4b7cf7"/>
      <stop offset="100%" style="stop-color:#6e9cf9"/>
    </linearGradient>
    <!-- Bright highlight gradient -->
    <linearGradient id="qHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9dc0fc"/>
      <stop offset="100%" style="stop-color:#d1e1fe"/>
    </linearGradient>
    <!-- Scan beam -->
    <linearGradient id="qScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4b7cf7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6e9cf9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4b7cf7;stop-opacity:0"/>
    </linearGradient>
    <!-- Checkmark gradient - teal trust color -->
    <linearGradient id="qCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <filter id="qGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="qShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="qOuterGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <g filter="url(#qShadow)">
    <path d="M256 48 L424 118 L424 264 Q424 388 256 468 Q88 388 88 264 L88 118 Z"
          fill="url(#qShieldGrad)" stroke="url(#qAccent)" stroke-width="3"/>
  </g>

  <!-- Shield inner highlight border -->
  <path d="M256 70 L406 134 L406 260 Q406 374 256 446 Q106 374 106 260 L106 134 Z"
        fill="none" stroke="#4b7cf7" stroke-width="1" opacity="0.25"/>

  <!-- Central "Q" letterform - open circle with diagonal tail -->
  <g filter="url(#qGlow)">
    <!-- Q circle - open at bottom-right, thick stroke -->
    <circle cx="252" cy="242" r="78" fill="none" stroke="url(#qAccent)" stroke-width="14" stroke-linecap="round"/>
    <!-- Q tail - slashes diagonally down-right, extends beyond circle -->
    <path d="M295 290 L345 360"
          fill="none" stroke="url(#qAccent)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Integrated checkmark inside the Q (verification/truth) -->
  <g filter="url(#qGlow)">
    <path d="M218 238 L244 268 L290 210"
          fill="none" stroke="url(#qCheck)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Horizontal scan lines through the Q (analysis visualization) -->
  <g opacity="0.35">
    <rect x="160" y="200" width="185" height="2.5" rx="1.25" fill="#9dc0fc"/>
    <rect x="158" y="220" width="190" height="2.5" rx="1.25" fill="#6e9cf9"/>
    <rect x="160" y="240" width="185" height="2.5" rx="1.25" fill="#9dc0fc"/>
    <rect x="165" y="260" width="175" height="2.5" rx="1.25" fill="#6e9cf9"/>
    <rect x="175" y="280" width="155" height="2.5" rx="1.25" fill="#9dc0fc"/>
  </g>

  <!-- Active scan beam -->
  <g filter="url(#qGlow)">
    <rect x="162" y="238" width="182" height="2.5" rx="1.25" fill="url(#qScan)"/>
  </g>

  <!-- Magnifying glass detail - top right of shield -->
  <g opacity="0.55" transform="translate(350, 130)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#9dc0fc" stroke-width="3"/>
    <line x1="15" y1="15" x2="32" y2="32" stroke="#9dc0fc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Finding severity dots - right side -->
  <circle cx="370" cy="210" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="372" cy="242" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="370" cy="270" r="5" fill="#4b7cf7" opacity="0.85"/>

  <!-- Data-point constellation pattern - left side -->
  <g opacity="0.35">
    <circle cx="138" cy="200" r="2.5" fill="#9dc0fc"/>
    <circle cx="128" cy="225" r="2" fill="#6e9cf9"/>
    <circle cx="135" cy="250" r="2.5" fill="#9dc0fc"/>
    <circle cx="130" cy="275" r="2" fill="#6e9cf9"/>
    <line x1="138" y1="200" x2="128" y2="225" stroke="#4b7cf7" stroke-width="0.8" opacity="0.5"/>
    <line x1="128" y1="225" x2="135" y2="250" stroke="#4b7cf7" stroke-width="0.8" opacity="0.5"/>
    <line x1="135" y1="250" x2="130" y2="275" stroke="#4b7cf7" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Orbiting arc - represents continuous quality assurance -->
  <g filter="url(#qOuterGlow)" opacity="0.45">
    <path d="M256 85 Q390 85 410 210" fill="none" stroke="#4b7cf7" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M102 210 Q102 85 256 85" fill="none" stroke="#4b7cf7" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
  </g>

  <!-- "QA" micro-text at top of shield -->
  <text x="256" y="148" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="36" fill="#9dc0fc" text-anchor="middle" letter-spacing="6" opacity="0.4">QA</text>

</svg>
