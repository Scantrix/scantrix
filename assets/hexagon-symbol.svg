<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>Qaverity Symbol (Vector)</title>
  <desc>Stylized Q with integrated checkmark and leaf/flame accent, cool-to-warm gradient.</desc>
  <defs>
    <!-- Main cool gradient for Q outline and checkmark -->
    <linearGradient id="gradMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F45FF"/>
      <stop offset="45%" stop-color="#2BB9F2"/>
      <stop offset="75%" stop-color="#36D7B4"/>
      <stop offset="100%" stop-color="#65E0C7"/>
    </linearGradient>

    <!-- Warm gradient for the leaf/flame accent -->
    <linearGradient id="gradLeaf" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFE067"/>
      <stop offset="60%" stop-color="#FFC14D"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>

    <!-- Subtle glow (optional) -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Group for Q outline and checkmark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Stylized Q: open arc with a diagonal tail at lower-right -->
    <!-- Center ~ (500,500), radius ~320; arc from ~220° to ~330° (gap in top-right) -->
    <path id="q_outline"
          d="M 255 706
             A 320 320 0 0 1 777 340
             L 880 860"
          stroke="url(#gradMain)"
          stroke-width="110"/>

    <!-- Integrated checkmark -->
    <path id="checkmark"
          d="M 360 540 L 500 665 L 780 360"
          stroke="url(#gradMain)"
          stroke-width="100"/>
  </g>

  <!-- Leaf/Flame accent -->
  <path id="leaf"
        d="M 820 400
           C 885 460, 900 525, 860 585
           C 825 635, 745 630, 760 555
           C 772 498, 790 435, 820 400 Z"
        fill="url(#gradLeaf)"/>
</svg>