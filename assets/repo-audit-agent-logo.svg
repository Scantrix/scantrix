<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient - deep navy to electric blue -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <!-- Accent gradient - electric cyan -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle outer glow -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle - subtle dark -->
  <circle cx="256" cy="256" r="248" fill="#030712" opacity="0"/>

  <!-- Shield body -->
  <g filter="url(#shadow)">
    <path d="M256 52 L420 120 L420 260 Q420 380 256 460 Q92 380 92 260 L92 120 Z"
          fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3"/>
  </g>

  <!-- Shield inner border highlight -->
  <path d="M256 72 L402 132 L402 258 Q402 368 256 440 Q110 368 110 258 L110 132 Z"
        fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>

  <!-- Code bracket left -->
  <g filter="url(#glow)">
    <path d="M175 195 L145 255 L175 315" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code bracket right -->
  <g filter="url(#glow)">
    <path d="M337 195 L367 255 L337 315" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code lines inside brackets (representing scanned code) -->
  <g opacity="0.5">
    <rect x="195" y="210" width="90" height="4" rx="2" fill="#94a3b8"/>
    <rect x="205" y="228" width="70" height="4" rx="2" fill="#64748b"/>
    <rect x="195" y="246" width="85" height="4" rx="2" fill="#94a3b8"/>
    <rect x="210" y="264" width="55" height="4" rx="2" fill="#64748b"/>
    <rect x="195" y="282" width="95" height="4" rx="2" fill="#94a3b8"/>
    <rect x="200" y="300" width="75" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Scanning beam across the code -->
  <g filter="url(#glow)">
    <rect x="185" y="253" width="142" height="2" rx="1" fill="url(#scanGrad)" opacity="0.9"/>
  </g>

  <!-- Magnifying glass - positioned at bottom-right of shield -->
  <g transform="translate(340, 330)" filter="url(#outerGlow)">
    <!-- Glass circle -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="5"/>
    <circle cx="0" cy="0" r="38" fill="#0f172a" opacity="0.6"/>
    <!-- Glass handle -->
    <line x1="28" y1="28" x2="58" y2="58" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Checkmark inside glass -->
    <path d="M-14 2 L-4 12 L16 -10" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small indicator dots - representing findings -->
  <circle cx="310" cy="218" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="298" cy="290" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="305" cy="252" r="4" fill="#22c55e" opacity="0.9"/>

</svg>
