<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 15 520 170" width="520" height="170">
  <defs>
    <linearGradient id="qsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="45%" style="stop-color:#152850"/>
      <stop offset="100%" style="stop-color:#1d3d84"/>
    </linearGradient>
    <linearGradient id="qsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4b7cf7"/>
      <stop offset="100%" style="stop-color:#6e9cf9"/>
    </linearGradient>
    <linearGradient id="qsScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4b7cf7;stop-opacity:0.0"/>
      <stop offset="50%" style="stop-color:#6e9cf9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4b7cf7;stop-opacity:0.0"/>
    </linearGradient>
    <linearGradient id="qsCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <filter id="qsGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="qsShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- === Shield Icon (scaled) === -->
  <g transform="translate(16, 4) scale(0.375)" filter="url(#qsShadow)">
    <!-- Shield body -->
    <path d="M256 48 L424 118 L424 264 Q424 388 256 468 Q88 388 88 264 L88 118 Z"
          fill="url(#qsGrad)" stroke="url(#qsAccent)" stroke-width="3"/>
    <path d="M256 70 L406 134 L406 260 Q406 374 256 446 Q106 374 106 260 L106 134 Z"
          fill="none" stroke="#4b7cf7" stroke-width="1" opacity="0.25"/>

    <!-- Q letterform -->
    <g filter="url(#qsGlow)">
      <circle cx="252" cy="242" r="68" fill="#0f172a" opacity="0.6" stroke="url(#qsAccent)" stroke-width="14" stroke-linecap="round"/>
      <path d="M295 290 L345 340"
            fill="none" stroke="url(#qsAccent)" stroke-width="14" stroke-linecap="square"/>
    </g>

    <!-- Checkmark -->
    <g filter="url(#qsGlow)">
      <path d="M218 238 L244 268 L290 210"
            fill="none" stroke="url(#qsCheck)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Scan lines -->
    <g opacity="0.35">
      <rect x="160" y="200" width="185" height="2.5" rx="1.25" fill="#9dc0fc"/>
      <rect x="158" y="220" width="190" height="2.5" rx="1.25" fill="#6e9cf9"/>
      <rect x="160" y="240" width="185" height="2.5" rx="1.25" fill="#9dc0fc"/>
      <rect x="165" y="260" width="175" height="2.5" rx="1.25" fill="#6e9cf9"/>
      <rect x="175" y="280" width="155" height="2.5" rx="1.25" fill="#9dc0fc"/>
    </g>
    <g filter="url(#qsGlow)">
      <rect x="162" y="238" width="182" height="2.5" rx="1.25" fill="url(#qsScan)"/>
    </g>

    <!-- Severity dots -->
    <circle cx="370" cy="210" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="372" cy="242" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="370" cy="270" r="5" fill="#49c14b" opacity="0.85"/>
  </g>

  <!-- === Typography === -->
  <g>
    <!-- QAVERITY wordmark -->
    <text x="188" y="118" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="72" fill="#e2e8f0" letter-spacing="6">
      <tspan fill="#e2e8f0" font-weight="500">Q</tspan><tspan fill="#e2e8f0" font-weight="400">AVERITY</tspan>
    </text>

    <!-- Decorative accent line -->
    <rect x="198" y="134" width="435" height="2.5" rx="2.25" fill="#4b7cf7"/>

    <!-- Tagline -->
    <!--
    <text x="188" y="169" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22" fill="#6e9cf9" letter-spacing="2" opacity="0.9">
      RESILIENT AUTOMATION FRAMEWORKS
    </text>
    -->

