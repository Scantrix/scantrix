      <rect x="0" y="0" width="88" height="22" rx="11" fill="none" stroke="#4b7cf7" stroke-width="1" opacity="0.5"/>
      <text x="44" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#4b7cf7" text-anchor="middle" letter-spacing="1" opacity="0.5">PLAYWRIGHT</text>

      <rect x="105" y="0" width="70" height="22" rx="11" fill="none" stroke="#4b7cf7" stroke-width="1" opacity="0.5"/>
      <text x="140" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#4b7cf7" text-anchor="middle" letter-spacing="1" opacity="0.5">CYPRESS</text>

      <rect x="190" y="0" width="78" height="22" rx="11" fill="none" stroke="#4b7cf7" stroke-width="1" opacity="0.5"/>
      <text x="229" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#4b7cf7" text-anchor="middle" letter-spacing="1" opacity="0.5">SELENIUM</text>

