<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Chrome: bright upper-left → dark lower-right -->
    <linearGradient id="chrome" x1="50" y1="30" x2="350" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fafafa"/>
      <stop offset="5%"   stop-color="#f0f0f0"/>
      <stop offset="12%"  stop-color="#e0e0e0"/>
      <stop offset="20%"  stop-color="#cdcdcd"/>
      <stop offset="30%"  stop-color="#b5b5b5"/>
      <stop offset="40%"  stop-color="#9a9a9a"/>
      <stop offset="50%"  stop-color="#808080"/>
      <stop offset="60%"  stop-color="#686868"/>
      <stop offset="70%"  stop-color="#545454"/>
      <stop offset="80%"  stop-color="#454548"/>
      <stop offset="90%"  stop-color="#38383e"/>
      <stop offset="100%" stop-color="#2e2e36"/>
    </linearGradient>

    <!-- Vertical tube highlight -->
    <linearGradient id="ringHL" x1="200" y1="15" x2="200" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="12%"  stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.00"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Specular hot-spot -->
    <radialGradient id="specular" cx="115" cy="95" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="20%"  stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer rim highlight -->
    <linearGradient id="outerRim" x1="200" y1="15" x2="200" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Inner rim shadow -->
    <linearGradient id="innerRim" x1="200" y1="15" x2="200" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Bar gradient -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a9fd4"/>
      <stop offset="15%"  stop-color="#3580b0"/>
      <stop offset="40%"  stop-color="#265f88"/>
      <stop offset="70%"  stop-color="#1a4260"/>
      <stop offset="100%" stop-color="#0e2a3e"/>
    </linearGradient>

    <!-- Dot gradient -->
    <radialGradient id="dotGrad" cx="0.28" cy="0.22" r="0.78" fx="0.28" fy="0.22">
      <stop offset="0%"   stop-color="#f4f4f4"/>
      <stop offset="30%"  stop-color="#c0c0c0"/>
      <stop offset="70%"  stop-color="#808088"/>
      <stop offset="100%" stop-color="#505058"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="ringDrop" x="-8%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="tailDrop" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.40"/>
    </filter>
    <filter id="barDrop" x="-15%" y="-8%" width="140%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="dotDrop" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g id="qaverity-mark">

    <!-- Q RING: 5-layer chrome stack -->
    <g id="q-ring">
      <circle cx="200" cy="200" r="145"
              fill="none" stroke="url(#chrome)" stroke-width="40"
              filter="url(#ringDrop)"/>
      <circle cx="200" cy="200" r="145"
              fill="none" stroke="url(#ringHL)" stroke-width="40"/>
      <circle cx="200" cy="200" r="145"
              fill="none" stroke="url(#specular)" stroke-width="40"/>
      <circle cx="200" cy="200" r="164"
              fill="none" stroke="url(#outerRim)" stroke-width="3"/>
      <circle cx="200" cy="200" r="126"
              fill="none" stroke="url(#innerRim)" stroke-width="3"/>
    </g>

    <!-- Q TAIL -->
    <g id="q-tail">
      <line x1="306" y1="306" x2="368" y2="368"
            stroke="url(#chrome)" stroke-width="38" stroke-linecap="round"
            filter="url(#tailDrop)"/>
      <line x1="306" y1="306" x2="368" y2="368"
            stroke="url(#ringHL)" stroke-width="38" stroke-linecap="round"/>
    </g>

    <!-- BARS -->
    <g id="q-bars" filter="url(#barDrop)">
      <rect x="126" y="232" width="30" height="73"  rx="3" fill="url(#barGrad)"/>
      <rect x="163" y="172" width="30" height="133" rx="3" fill="url(#barGrad)"/>
      <rect x="200" y="98"  width="30" height="207" rx="3" fill="url(#barGrad)"/>
    </g>

    <!-- DOT -->
    <circle id="q-dot" cx="298" cy="55" r="12"
            fill="url(#dotGrad)" filter="url(#dotDrop)"/>

  </g>
</svg>
