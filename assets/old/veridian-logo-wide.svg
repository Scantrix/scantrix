<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022c22"/>
      <stop offset="45%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
    <linearGradient id="vsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="vsScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#34d399;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="vsGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vsShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- === Shield Icon (scaled) === -->
  <g transform="translate(16, 4) scale(0.375)" filter="url(#vsShadow)">
    <!-- Shield body -->
    <path d="M256 48 L424 118 L424 264 Q424 388 256 468 Q88 388 88 264 L88 118 Z"
          fill="url(#vsGrad)" stroke="url(#vsAccent)" stroke-width="3"/>
    <path d="M256 70 L406 134 L406 260 Q406 374 256 446 Q106 374 106 260 L106 134 Z"
          fill="none" stroke="#10b981" stroke-width="1" opacity="0.25"/>
    <!-- V letterform -->
    <g filter="url(#vsGlow)">
      <path d="M185 170 L256 340 L327 170"
            fill="none" stroke="url(#vsAccent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Checkmark -->
    <g filter="url(#vsGlow)">
      <path d="M230 295 L250 320 L282 270"
            fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </g>
    <!-- Scan lines -->
    <g opacity="0.4">
      <rect x="170" y="200" width="172" height="3" rx="1.5" fill="#a7f3d0"/>
      <rect x="180" y="220" width="152" height="3" rx="1.5" fill="#6ee7b7"/>
      <rect x="190" y="240" width="132" height="3" rx="1.5" fill="#a7f3d0"/>
      <rect x="200" y="260" width="112" height="3" rx="1.5" fill="#6ee7b7"/>
      <rect x="210" y="280" width="92" height="3" rx="1.5" fill="#a7f3d0"/>
    </g>
    <g filter="url(#vsGlow)">
      <rect x="185" y="237" width="142" height="2.5" rx="1.25" fill="url(#vsScan)"/>
    </g>
    <!-- Severity dots -->
    <circle cx="335" cy="210" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="330" cy="242" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="322" cy="270" r="5" fill="#10b981" opacity="0.85"/>
  </g>

  <!-- === Typography === -->
  <g>
    <!-- VERIDIAN wordmark -->
    <text x="218" y="92" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="62" fill="#e2e8f0" letter-spacing="10">
      VERIDIAN
    </text>

    <!-- Decorative accent line -->
    <rect x="220" y="108" width="35" height="2.5" rx="1.25" fill="#10b981"/>

    <!-- Tagline -->
    <text x="220" y="134" width="40" height="2.5" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="390" font-size="14" fill="#6ee7b7" letter-spacing="3" opacity="0.8">
      RELIABLE AUTOMATION INTELLIGENCE
    </text>

    <!-- Framework pills -->
    <g transform="translate(220, 152)">
      <rect x="0" y="0" width="88" height="22" rx="11" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.4"/>
      <text x="44" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#10b981" text-anchor="middle" letter-spacing="1" opacity="0.7">PLAYWRIGHT</text>

      <rect x="105" y="0" width="70" height="22" rx="11" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.4"/>
      <text x="140" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#10b981" text-anchor="middle" letter-spacing="1" opacity="0.7">CYPRESS</text>

      <rect x="199" y="0" width="78" height="22" rx="11" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.4"/>
      <text x="238" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#10b981" text-anchor="middle" letter-spacing="1" opacity="0.7">SELENIUM</text>

      <rect x="295" y="0" width="38" height="22" rx="11" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.4"/>
      <text x="312" y="15" font-family="'Segoe UI', 'Inter', monospace" font-weight="500" font-size="11" fill="#10b981" text-anchor="middle" letter-spacing="1" opacity="0.7">CI</text>
    </g>
  </g>
</svg>
