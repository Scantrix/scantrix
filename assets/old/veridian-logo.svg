<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient - deep emerald -->
    <linearGradient id="vShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022c22"/>
      <stop offset="45%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
    <!-- Accent gradient - viridian to emerald glow -->
    <linearGradient id="vAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <!-- Gold accent for premium feel -->
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <!-- Scan beam -->
    <linearGradient id="vScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#34d399;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="vGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="vOuterGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <g filter="url(#vShadow)">
    <path d="M256 48 L424 118 L424 264 Q424 388 256 468 Q88 388 88 264 L88 118 Z"
          fill="url(#vShieldGrad)" stroke="url(#vAccent)" stroke-width="3"/>
  </g>

  <!-- Shield inner highlight border -->
  <path d="M256 70 L406 134 L406 260 Q406 374 256 446 Q106 374 106 260 L106 134 Z"
        fill="none" stroke="#10b981" stroke-width="1" opacity="0.25"/>

  <!-- Central "V" letterform - bold, geometric -->
  <g filter="url(#vGlow)">
    <path d="M185 170 L256 340 L327 170"
          fill="none" stroke="url(#vAccent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Checkmark integrated into the V base -->
  <g filter="url(#vGlow)">
    <path d="M230 295 L250 320 L282 270"
          fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Horizontal scan lines through the V (analysis visualization) -->
  <g opacity="0.4">
    <rect x="170" y="200" width="172" height="3" rx="1.5" fill="#a7f3d0"/>
    <rect x="180" y="220" width="152" height="3" rx="1.5" fill="#6ee7b7"/>
    <rect x="190" y="240" width="132" height="3" rx="1.5" fill="#a7f3d0"/>
    <rect x="200" y="260" width="112" height="3" rx="1.5" fill="#6ee7b7"/>
    <rect x="210" y="280" width="92" height="3" rx="1.5" fill="#a7f3d0"/>
  </g>

  <!-- Active scan beam -->
  <g filter="url(#vGlow)">
    <rect x="185" y="237" width="142" height="2.5" rx="1.25" fill="url(#vScan)"/>
  </g>

  <!-- Finding severity dots - right side -->
  <circle cx="335" cy="210" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="330" cy="242" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="322" cy="270" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Orbiting arc - represents continuous analysis -->
  <g filter="url(#vOuterGlow)" opacity="0.5">
    <path d="M256 85 Q380 85 400 200" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M112 200 Q112 85 256 85" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
  </g>

</svg>
