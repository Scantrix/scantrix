<!DOCTYPE html>
<html>
<head>
  <title>Qaverity Logo Preview</title>
  <style>
    body { margin: 0; background: #1a2438; font-family: Arial, sans-serif; color: #ccc; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h2 { color: #7ab; margin: 30px 0 10px; }
    .compare { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 400px; }
    .panel img, .panel object { max-width: 100%; height: auto; }
    .label { font-size: 13px; color: #888; margin-bottom: 6px; }
    .dark-bg { background: #0d1520; padding: 20px; border-radius: 8px; }
    .light-bg { background: #ffffff; padding: 20px; border-radius: 8px; }
    .icon-row { display: flex; gap: 20px; align-items: center; }
    .icon-row .dark-bg, .icon-row .light-bg { flex: 0 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Color Full Logo — Dark Background</h2>
    <div class="compare">
      <div class="panel">
        <div class="label">Recreation</div>
        <div class="dark-bg">
          <img src="qaverity-full.svg" alt="Full logo color">
        </div>
      </div>
      <div class="panel">
        <div class="label">Reference</div>
        <div class="dark-bg">
          <img src="qaverity.png" alt="Reference" style="max-width:500px;">
        </div>
      </div>
    </div>

    <h2>Color Full Logo — Light Background</h2>
    <div class="light-bg">
      <img src="qaverity-full.svg" alt="Full logo color on white">
    </div>

    <h2>Mono Full Logo</h2>
    <div class="compare">
      <div class="panel">
        <div class="label">On White</div>
        <div class="light-bg">
          <img src="qaverity-full-mono.svg" alt="Mono on white">
        </div>
      </div>
      <div class="panel">
        <div class="label">On Dark</div>
        <div class="dark-bg">
          <img src="qaverity-full-mono.svg" alt="Mono on dark">
        </div>
      </div>
    </div>

    <h2>Q Mark Icon</h2>
    <div class="icon-row">
      <div>
        <div class="label">Color / Dark</div>
        <div class="dark-bg" style="width:180px; height:180px; display:flex; align-items:center; justify-content:center;">
          <img src="qaverity-mark.svg" width="140">
        </div>
      </div>
      <div>
        <div class="label">Color / Light</div>
        <div class="light-bg" style="width:180px; height:180px; display:flex; align-items:center; justify-content:center;">
          <img src="qaverity-mark.svg" width="140">
        </div>
      </div>
      <div>
        <div class="label">Mono / White</div>
        <div class="light-bg" style="width:180px; height:180px; display:flex; align-items:center; justify-content:center;">
          <img src="qaverity-mark-mono.svg" width="140">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
