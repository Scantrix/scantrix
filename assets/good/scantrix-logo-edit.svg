<svg xmlns="http://www.w3.org/2000/svg" viewBox="39 9 556 183" width="960" height="316">
  <defs>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#152850"/>
      <stop offset="100%" style="stop-color:#1d3d84"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c79f6"/>
      <stop offset="100%" style="stop-color:#6e9cf9"/>
    </linearGradient>
    <linearGradient id="scanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4c79f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6e9cf9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4c79f6;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  
   <!-- === Icon (scaled down shield) === -->
  <g transform="translate(30, 55) scale(0.2)" filter="url(#shadow2)">
    <!-- Shield body -->
    <path d="M256 52 L420 120 L420 260 Q420 380 256 460 Q92 380 92 260 L92 120 Z"
          fill="url(#shieldGrad2)" stroke="url(#accentGrad2)" stroke-width="3"/>
    <!-- Inner border -->
    <path d="M256 72 L402 132 L402 258 Q402 368 256 440 Q110 368 110 258 L110 132 Z"
          fill="none" stroke="#4c79f6" stroke-width="1" opacity="0.3"/>
    <!-- Code brackets -->
    <g filter="url(#glow2)">
      <path d="M175 195 L145 255 L175 315" fill="none" stroke="#4c79f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M337 195 L367 255 L337 315" fill="none" stroke="#4c79f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Code lines -->
    <g opacity="0.5">
      <rect x="195" y="210" width="90" height="4" rx="2" fill="#94a3b8"/>
      <rect x="205" y="228" width="70" height="4" rx="2" fill="#64748b"/>
      <rect x="195" y="246" width="85" height="4" rx="2" fill="#94a3b8"/>
      <rect x="210" y="264" width="55" height="4" rx="2" fill="#64748b"/>
      <rect x="195" y="282" width="95" height="4" rx="2" fill="#94a3b8"/>
      <rect x="200" y="300" width="75" height="4" rx="2" fill="#64748b"/>
    </g>
    <!-- Scan beam -->
    <g filter="url(#glow2)">
      <rect x="185" y="253" width="142" height="2" rx="1" fill="url(#scanGrad2)" opacity="0.9"/>
    </g>
    <!-- Magnifying glass -->
    <g transform="translate(340, 330)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#accentGrad2)" stroke-width="15"/>
      <circle cx="0" cy="0" r="38" fill="#0f172a" opacity="0.6"/>
      <line x1="28" y1="28" x2="58" y2="58" stroke="url(#accentGrad2)" stroke-width="10" stroke-linecap="square"/>
      <path d="M-14 2 L-4 12 L16 -10" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Finding dots -->
    <circle cx="310" cy="218" r="5" fill="#ef4444" opacity="0.9"/>
    <circle cx="298" cy="290" r="5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="305" cy="252" r="5" fill="#22c55e" opacity="0.9"/>
  </g>

  <!-- === Text === -->
  <g transform="translate(0, 1) scale(1.3)" filter="url(#shadow2)">
    <!-- "REPO AUDIT" - main title -->
    <text x="100" y="100" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="66" fill="#e2e8f0" letter-spacing="4">
      SC
    </text>
    <text x="190" y="100" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="66" fill="#4c79f6" letter-spacing="4">
      &#923;
    </text>
    <text x="240" y="100" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="66" fill="#e2e8f0" letter-spacing="4">
      NTRIX
    </text>
    <!-- dot over the "i" -->
    <circle cx="398" cy="70" r="7" fill="#4c79f6" opacity="0.0"/>

     <!-- Decorative accent line -->
    <rect x="392" y="80" width="12" height="35.5" rx="1" fill="#4c79f6" opacity="0.0"/>

    <!-- Tagline -->
    <text x="101" y="118" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#4c79f6" letter-spacing="1" textLength="356" lengthAdjust="spacing">
      Automation Framework Diagnostics
    </text>
  </g>
</svg>

