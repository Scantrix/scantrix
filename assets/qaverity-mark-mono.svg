<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="mono" x1="50" y1="30" x2="350" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="monoHL" x1="200" y1="15" x2="200" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <g id="qaverity-mark-mono">
    <g id="q-ring">
      <circle cx="200" cy="200" r="145"
              fill="none" stroke="url(#mono)" stroke-width="40"/>
      <circle cx="200" cy="200" r="145"
              fill="none" stroke="url(#monoHL)" stroke-width="40"/>
    </g>
    <g id="q-tail">
      <line x1="306" y1="306" x2="368" y2="368"
            stroke="#000000" stroke-width="38" stroke-linecap="round"/>
    </g>
    <g id="q-bars">
      <rect x="126" y="232" width="30" height="73"  rx="3" fill="#000000"/>
      <rect x="163" y="172" width="30" height="133" rx="3" fill="#000000"/>
      <rect x="200" y="98"  width="30" height="207" rx="3" fill="#000000"/>
    </g>
    <circle id="q-dot" cx="298" cy="55" r="12" fill="#1a1a1a"/>
  </g>
</svg>
