<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 330 50" width="450" height="80" role="img" aria-label="SCANTRIX">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72a6f9"/>
      <stop offset="100%" stop-color="#084ec0"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="24" y="78"
        font-family="'Inter','Roboto','Helvetica Neue',Arial,sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="1.6"
        fill="#e2e8f0"
        dominant-baseline="alphabetic">
    <tspan>SC</tspan>
    <!-- Lambda A -->
    <tspan dx="-16" fill="url(#accent)" font-weight="800">Λ</tspan>
    <tspan dx="-16" fill="#e2e8f0" font-weight="700">NTRIX</tspan>
  </text>

       <!-- Decorative accent line -->
    <rect x="24" y="85" width="320" height="2" rx="1" fill="#65758b" opacity="0.9"/>

  <!-- Tagline -->
  <text x="25" y="102" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="" fill="#4c79f6" letter-spacing="1" textLength="320" lengthAdjust="spacing">
    AUTOMATION FRAMEWORK DIAGNOSTICS
  </text>


</svg>

